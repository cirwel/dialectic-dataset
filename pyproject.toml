[project]
name = "dialectic-dataset"
version = "0.1.0"
description = "Dialectic reasoning dataset pipeline for integrative resolution training"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gen = ["anthropic>=0.40.0"]
train = ["torch>=2.1.0", "transformers>=4.36.0", "peft>=0.12.0", "trl>=0.9.0", "datasets>=2.18.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
dialectic-generate = "dialectic_dataset.cli:cmd_generate"
dialectic-prepare = "dialectic_dataset.cli:cmd_prepare"
dialectic-eval = "dialectic_dataset.cli:cmd_eval"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
